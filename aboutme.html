<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>About Me</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Inter',sans-serif;
  background:#ffffff;
  color:#0f172a;
  transition:0.5s;
}
body.dark{
  background:#000;
  color:#e5e7eb;
}

header{
  position:fixed;
  top:0;
  width:100%;
  padding:18px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(255,255,255,0.9);
  border-bottom:1px solid #e2e8f0;
  z-index:100;
}

.back{
  text-decoration:none;
  color:#2563eb;
  font-size:.9rem;
  font-weight:500;
}

/* ===== Layout ===== */
.container{
  max-width:1100px;
  margin:0 auto;
  padding:140px 40px 80px;
  display:flex;
  align-items:center;
  gap:80px;
}

@media(max-width:768px){
  .container{
    flex-direction:column;
    text-align:center;
  }
}

/* ===== Profile Image ===== */
.profile-img{
  width:260px;
  height:260px;
  border-radius:50%;
  overflow:hidden;
  box-shadow:0 20px 40px rgba(0,0,0,0.15);
  flex-shrink:0;
  transition:0.3s;
}
.profile-img:hover{
  transform:scale(1.04);
}

.profile-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ===== Content ===== */
.content{
  flex:1;
}

h1{
  font-size:2.5rem;
  margin-bottom:20px;
  line-height:1.4;
}

/* Gradient Highlight */
.highlight{
  background:linear-gradient(90deg,#2563eb,#60a5fa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  font-weight:700;
}

body.dark .highlight{
  background:linear-gradient(90deg,#60a5fa,#93c5fd);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* Sub text */
.subtitle{
  margin-top:10px;
  color:#64748b;
  font-size:0.95rem;
}
body.dark .subtitle{
  color:#94a3b8;
}

/* Info Section */
.info{
  margin-top:50px;
  display:flex;
  flex-direction:column;
  gap:25px;
}

.info-item{
  font-size:1rem;
}

.label{
  font-weight:600;
  margin-bottom:6px;
}

/* Skills */
.skills{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:10px;
}

.tag{
  font-size:.75rem;
  background:#e2e8f0;
  padding:6px 10px;
  border-radius:8px;
  color:#1f2937;
  border:1px solid #cbd5e1;
  transition:0.2s;
}
.tag:hover{
  background:#cbd5e1;
}

body.dark .tag{
  background:#222;
  color:#ddd;
  border-color:#444;
}

/* Divider */
.divider{
  width:60px;
  height:4px;
  background:#2563eb;
  margin:30px 0;
  border-radius:10px;
  opacity:0.7;
}

</style>
</head>

<body>

<header>
  <a href="index.html" class="back">← Back to Portfolio</a>
</header>

<div class="container">

  <!-- Profile Image -->
  <div class="profile-img">
    <img src="watersu.JPG" alt="profile">
  </div>

  <!-- Content -->
  <div class="content">

    <h1>
      안녕하세요, <span class="highlight">문제를 구조적으로 해결하는</span><br>
      엔지니어가 되고싶습니다.
    </h1>

    <p class="subtitle">
      Infrastructure · DevOps · Cloud를 연결하는 엔지니어
    </p>

    <div class="divider"></div>

    <div class="info">

      <div class="info-item">
        <div class="label">🎓 학력</div>
        <div>동국대학교 정보통신공학과 졸업</div>
      </div>

      <div class="info-item">
        <div class="label">🧠 MBTI</div>
        <div>ENTJ</div>
      </div>

      <div class="info-item">
        <div class="label">🛠 기술 스택</div>
        <div class="skills">
          <span class="tag">Linux</span>
          <span class="tag">React</span>
          <span class="tag">Python</span>
          <span class="tag">MySQL</span>
          <span class="tag">OracleDB</span>
          <span class="tag">AWS</span>
          <span class="tag">Container</span>
        </div>
      </div>

    </div>

  </div>

</div>

</body>
</html>
