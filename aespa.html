<!DOCTYPE html>
<html lang="ko">

<head>

    <!-- Tailwind CSS -->

    <!-- React & ReactDOM (Development version for easier debugging, change to production later) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link

        rel="stylesheet">

    <style>
        @keyframes drift {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes glitch {
            0% {
                transform: translate(0)
            }

            20% {
                transform: translate(-2px, 2px)
            }

            40% {
                transform: translate(-2px, -2px)
            }

            60% {
                transform: translate(2px, 2px)
            }

            80% {
                transform: translate(2px, -2px)
            }

            100% {
                transform: translate(0)
            }
        }

        .cyber-bg {
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0f0f1b 100%);
        }

        .aura {
            filter: blur(80px);
            opacity: 0.4;
            animation: drift 20s linear infinite;
        }

        .cyber-text {
            font-family: 'Syncopate', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5em;
            background: linear-gradient(135deg, #fff 0%, #a855f7 50%, #22d3ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .chrome-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.5s ease;
        }

        .chrome-card:hover {
            border-color: #a855f7;
            transform: scale(1.02) translateY(-10px);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.3);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        .glitch-hover:hover {
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
        }
    </style>
</head>

                                SCROLL TO CONNECT
                            </div>
                        </div>
                    </main>

                        VERSION 2.0 // © 2026 WATERSU DIGITAL ENTITY. ALL RIGHTS RESERVED.
                    </footer>
                </div>
            );

</body>

</html>
